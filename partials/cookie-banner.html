<div id="cookieBanner" class="cookie-banner">
  <div class="cookie-banner-icon">
    <i data-lucide="cookie" width="20" height="20"></i>
  </div>
  <div class="cookie-banner-body">
    <span class="cookie-banner-title" data-i18n="cookie_title"
      >Privacy Notice</span
    >
    <p class="cookie-banner-text" data-i18n="cookie_text">
      This site uses Google Analytics for anonymous traffic measurement.
    </p>
  </div>
  <div class="cookie-banner-actions">
    <button
      class="cookie-accept btn-primary"
      onclick="acceptCookies()"
      data-i18n="cookie_accept"
    >
      Accept
    </button>
    <button
      class="cookie-decline"
      onclick="declineCookies()"
      data-i18n="cookie_decline"
    >
      Decline
    </button>
  </div>
</div>
