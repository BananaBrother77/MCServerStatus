<div class="feedback-modal" id="feedbackModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Feedback</h2>
      <button
        class="modal-close"
        id="closeFeedbackBtn"
        aria-label="Close feedback"
      >
        &times;
      </button>
    </div>
    <div class="modal-body">
      <div id="feedbackForm">
        <p class="feedback-desc">Help me improve MCToolkit.</p>

        <div class="form-group">
          <label class="form-label">Category</label>
          <div class="feedback-categories" id="categoryGrid">
            <div class="feedback-category" data-category="Server Status">
              <i data-lucide="server"></i><span>Server Status</span>
            </div>
            <div class="feedback-category" data-category="Player Viewer">
              <i data-lucide="user"></i><span>Player Viewer</span>
            </div>
            <div class="feedback-category" data-category="Colour Codes">
              <i data-lucide="palette"></i><span>Colour Codes</span>
            </div>
            <div class="feedback-category" data-category="General">
              <i data-lucide="message-square"></i><span>General</span>
            </div>
            <div class="feedback-category" data-category="Other...">
              <i data-lucide="more-horizontal"></i><span>Other</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Rating</label>
          <div class="star-rating" id="feedbackRating">
            <div class="star" data-value="1"><i data-lucide="star"></i></div>
            <div class="star" data-value="2"><i data-lucide="star"></i></div>
            <div class="star" data-value="3"><i data-lucide="star"></i></div>
            <div class="star" data-value="4"><i data-lucide="star"></i></div>
            <div class="star" data-value="5"><i data-lucide="star"></i></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="feedbackText">Your feedback</label>
          <textarea
            id="feedbackText"
            class="edit-input feedback-textarea"
            rows="5"
            placeholder="What's on your mind?"
          ></textarea>
          <div class="char-hint">0/10</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="feedbackContact"
            >Contact <span class="label-optional">(optional)</span></label
          >
          <input
            id="feedbackContact"
            class="edit-input"
            type="text"
            placeholder="e.g. Discord username, email"
          />
        </div>

        <div class="form-group">
          <div id="turnstile-feedback"></div>
        </div>

        <button
          class="btn-primary feedback-submit"
          id="btnFeedbackSubmit"
          disabled
        >
          Send Feedback
        </button>
      </div>

      <div id="feedbackSuccess" class="feedback-success">
        <div class="success-icon"><i data-lucide="check"></i></div>
        <div class="success-title">Thank you!</div>
        <div class="success-text">
          I read every submission and use it to improve MCToolkit.
        </div>
      </div>
    </div>
  </div>
</div>
