<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCToolkit | 404 - Page Not Found</title>
    <meta name="description" content="Page not found." />
    <meta property="og:title" content="404 | MCToolkit" />
    <meta
      property="og:description"
      content="Page not found. Probably lost while trying to center a div."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/BananaBrother77/global-assets/refs/heads/main/profile.jpeg"
    />
    <meta name="theme-color" content="#7c58cc" />
    <link rel="canonical" href="https://mctoolkit.bananabrother77.online/404" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <main class="app-wrapper">
      <div class="e404-hero">
        <h1 class="e404-heading"><span class="e404-highlight">404</span> <span data-i18n="e404_heading">- Page Not Found</span></h1>

        <p class="e404-subtitle" data-i18n="404_subtitle">
          Where are you trying to go? What are you looking for? I, of course, don't know that, but I know that you won't find it here.
        </p>

        <div class="e404-actions">
          <a href="/" class="btn-primary">
            <i data-lucide="home" width="20" height="20"></i>
            <span data-i18n="404_btn_home">Go Home</span>
          </a>
          <button id="reloadBtn" class="btn-primary">
            <i data-lucide="refresh-cw" width="20" height="20"></i>
            <span data-i18n="404_btn_reload">Reload (Won't help)</span>
          </button>
        </div>

        <p class="e404-protip" data-i18n="404_protip">
          Pro Tip: I don't know, what did you expect?
        </p>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/assets/js/translations.js"></script>
    <script type="module" src="/assets/js/theme.js"></script>
    <script type="module" src="/assets/js/meow.js"></script>
    <script type="module" src="/assets/js/404.js"></script>
  </body>
</html>
