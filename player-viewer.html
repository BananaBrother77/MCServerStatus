<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Look up any Minecraft player - view their skin in 3D, UUID, cape, and more. MCToolkit by BananaBrother77."
    />
    <meta
      property="og:title"
      content="Player Viewer - MCToolkit | BananaBrother77"
    />
    <meta
      property="og:description"
      content="Look up any Minecraft player - view their skin in 3D, UUID, cape, and more."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://mctoolkit.bananabrother77.online/player-viewer"
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/BananaBrother77/global-assets/refs/heads/main/profile.jpeg"
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Player Viewer - MCToolkit | BananaBrother77"
    />
    <meta
      name="twitter:description"
      content="Look up any Minecraft player - view their skin in 3D, UUID, cape, and more."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/BananaBrother77/global-assets/refs/heads/main/profile.jpeg"
    />
    <link
      rel="canonical"
      href="https://mctoolkit.bananabrother77.online/player-viewer"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Player Viewer - MCToolkit | BananaBrother77</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- ============================================================
         SIDEBAR TOGGLE BUTTON
         ============================================================ -->
    <div class="serverListWrapper">
      <a href="index.html" class="menu-btn" data-i18n-title="back_home" title="Back to Home">
        <i data-lucide="home" width="35" height="35"></i>
      </a>
      <div class="menu-btn" id="pvSidebarToggle">
        <i data-lucide="users" width="35" height="35"></i>
      </div>
      <div class="menu-btn" id="pvShareBtn">
        <i data-lucide="square-arrow-up-right" width="35" height="35"></i>
      </div>
      <div class="menu-btn" id="settingsBtn">
        <i data-lucide="settings" width="35" height="35"></i>
      </div>
    </div>

    <!-- ============================================================
         SIDEBAR
         ============================================================ -->
    <aside id="pvSidebar" class="sidebar">
      <div class="sidebar-header">
        <h3 data-i18n="pv_sidebar_title">Player Lookup</h3>
        <button id="closePvSidebar">&times;</button>
      </div>

      <div class="input-group">
        <input
          type="text"
          id="pvSearchInput"
          class="form-input"
          placeholder="Search player..."
          data-i18n-placeholder="pv_search_placeholder"
        />
        <button class="input-btn" id="pvSearchBtn">
          <i data-lucide="search" width="20" height="20"></i>
        </button>
      </div>

      <ul id="pvPlayerList" class="pv-player-list"></ul>

      <div class="pv-sidebar-footer">
        <button id="pvClearRecent" class="pv-clear-btn" data-i18n="pv_clear_recent">Clear Recent</button>
        <button id="pvClearFavs" class="pv-clear-btn" data-i18n="pv_clear_favs">Clear Favourites</button>
      </div>
    </aside>

    <div id="pvSidebarOverlay" class="sidebar-overlay"></div>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <main class="app-wrapper">
      <div class="pv-main">
          <!-- Player info card -->
          <div id="pvPlayerCard" class="pv-player-card pv-card">
            <div class="pv-skin-section">
              <canvas id="pvSkinContainer"></canvas>
              <div class="pv-skin-actions">
                <button class="pv-skin-btn" id="pvDownloadSkinBtn" title="Download Skin" data-i18n-title="pv_download_skin">
                  <i data-lucide="download"></i>
                </button>
                <button class="pv-skin-btn" id="pvAnimationBtn" title="Toggle Animation" data-i18n-title="pv_toggle_animation">
                  <i data-lucide="pause"></i>
                </button>
              </div>
            </div>

            <div class="pv-info">
              <div class="pv-info-field">
                <span class="pv-info-label" data-i18n="pv_name_label">Player Name</span>
                <div>
                  <span class="pv-info-value" id="pvNameText">BananaBrother77</span>
                  <button class="pv-copy-btn" id="pvCopyNameBtn">
                    <i data-lucide="copy"></i>
                  </button>
                </div>
              </div>

              <div class="pv-info-field">
                <span class="pv-info-label" data-i18n="pv_uuid_label">UUID</span>
                <div>
                  <span class="pv-info-value-sm" id="pvUUIDText">61bd7ef7...</span>
                  <button class="pv-copy-btn" id="pvCopyUUIDBtn">
                    <i data-lucide="copy"></i>
                  </button>
                </div>
              </div>

              <div class="pv-actions">
                <a id="pvNameMCLink" href="https://namemc.com/" target="_blank" class="btn-primary">
                  <i data-lucide="external-link"></i> <span data-i18n="pv_namemc">NameMC</span>
                </a>
              </div>
            </div>
          </div>
        </div>
    </main>

    <!-- ============================================================
         FOOTER
         ============================================================ -->
    <footer class="site-footer reveal">
      <div class="footer-content">
        <div class="footer-brand">
          <h2 class="footer-logo">BananaBrother77</h2>
        </div>
        <div class="footer-social">
          <a
            href="https://bananabrother77.online/"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link"
            title="Website"
            data-i18n-title="website_title"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="currentColor"
            >
              <path
                d="M160-120v-480l320-240 320 240v480H560v-280H400v280H160Z"
              />
            </svg>
          </a>
          <a
            href="https://discord.gg/mtzPBcjUHN"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link"
            title="Discord"
            data-i18n-title="discord_title"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"
              />
            </svg>
          </a>
          <a
            href="https://github.com/BananaBrother77"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link"
            title="GitHub"
            data-i18n-title="github_title"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
          </a>
        </div>
      </div>
      <div class="footer-bottom">
        <span data-i18n="footer_made">Made with</span>
        <span class="text-heart">&hearts;</span>
        <span data-i18n="footer_and">and</span>
        <span class="text-code-muted" data-i18n="footer_code">code</span>
        <span data-i18n="footer_rights">- All rights reserved.</span>
      </div>
    </footer>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="settings_title">Settings</h2>
          <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="settings-section">
            <h3 class="settings-section-title" data-i18n="settings_theme">Theme</h3>
            <div class="theme-grid">
              <button class="theme-btn theme-btn--default active" data-theme="purple" data-i18n="theme_purple">Purple</button>
              <button class="theme-btn theme-btn--green" data-theme="green" data-i18n="theme_green">Green</button>
              <button class="theme-btn theme-btn--red" data-theme="red" data-i18n="theme_red">Red</button>
              <button class="theme-btn theme-btn--yellow" data-theme="yellow" data-i18n="theme_yellow">Yellow</button>
              <button class="theme-btn theme-btn--blue" data-theme="blue" data-i18n="theme_blue">Blue</button>
            </div>
          </div>
          <div class="settings-section">
            <h3 class="settings-section-title" data-i18n="settings_lang">Language</h3>
            <button class="lang-btn" id="langSwitchBtn">
              <span class="lang-name" data-i18n="lang_name">English</span>
            </button>
            <label class="custom-checkbox sync-checkbox">
              <input type="checkbox" id="syncThemeCheckbox" />
              <span class="checkmark"></span>
              <span class="sync-label">
                <span data-i18n="settings_sync_theme">Sync theme across sites</span>
                <span class="hint-icon" tabindex="0">
                  <i data-lucide="help-circle" width="16" height="16"></i>
                  <span class="hint-tooltip" data-i18n="settings_sync_theme_hint">When enabled, your theme preference is shared across all BananaBrother77 websites via a cookie.</span>
                </span>
              </span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/assets/js/translations.js"></script>
    <script type="module" src="/assets/js/theme.js"></script>
    <script type="module" src="/assets/js/meow.js"></script>
    <script type="module" src="/assets/js/player-viewer.js"></script>
    <script type="module" src="/assets/js/reveal.js"></script>
    <script type="module" src="/assets/js/icons.js"></script>
  </body>
</html>
