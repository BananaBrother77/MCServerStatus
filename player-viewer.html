<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Look up any Minecraft player - view their skin in 3D, UUID, cape, and more. MCToolkit by BananaBrother77."
    />
    <meta
      property="og:title"
      content="Player Viewer - MCToolkit | BananaBrother77"
    />
    <meta
      property="og:description"
      content="Look up any Minecraft player - view their skin in 3D, UUID, cape, and more."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://mctoolkit.bananabrother77.online/player-viewer"
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/BananaBrother77/global-assets/refs/heads/main/profile.jpeg"
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Player Viewer - MCToolkit | BananaBrother77"
    />
    <meta
      name="twitter:description"
      content="Look up any Minecraft player - view their skin in 3D, UUID, cape, and more."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/BananaBrother77/global-assets/refs/heads/main/profile.jpeg"
    />
    <link
      rel="canonical"
      href="https://mctoolkit.bananabrother77.online/player-viewer"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Player Viewer - MCToolkit | BananaBrother77</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- ============================================================
         SIDEBAR TOGGLE BUTTON
         ============================================================ -->
    <div class="serverListWrapper">
      <a
        href="index.html"
        class="menu-btn"
        data-i18n-title="back_home"
        aria-label="Back to Home"
        title="Back to Home"
      >
        <i data-lucide="home" width="35" height="35"></i>
      </a>
      <button
        class="menu-btn"
        id="toolNavBtn"
        type="button"
        aria-label="Tools"
        title="Tools"
      >
        <i data-lucide="compass" width="35" height="35"></i>
      </button>
      <button
        class="menu-btn"
        id="pvSidebarToggle"
        type="button"
        aria-label="Recent Players"
        title="Recent Players"
      >
        <i data-lucide="users" width="35" height="35"></i>
      </button>
      <button
        class="menu-btn"
        id="pvShareBtn"
        type="button"
        aria-label="Share Player"
        title="Share Player"
      >
        <i data-lucide="square-arrow-up-right" width="35" height="35"></i>
      </button>
      <button
        class="menu-btn"
        id="settingsBtn"
        type="button"
        aria-label="Settings"
        title="Settings"
      >
        <i data-lucide="settings" width="35" height="35"></i>
      </button>
    </div>

    <!-- ============================================================
         SIDEBAR
         ============================================================ -->
    <aside id="pvSidebar" class="sidebar">
      <div class="sidebar-header">
        <h3 data-i18n="pv_sidebar_title">Player Lookup</h3>
        <button id="closePvSidebar" aria-label="Close player lookup">
          &times;
        </button>
      </div>

      <div class="input-group">
        <input
          type="text"
          id="pvSearchInput"
          class="form-input"
          placeholder="Search player..."
          data-i18n-placeholder="pv_search_placeholder"
        />
        <button class="input-btn" id="pvSearchBtn" aria-label="Search player">
          <i data-lucide="search" width="20" height="20"></i>
        </button>
      </div>

      <ul id="pvPlayerList" class="pv-player-list"></ul>

      <div class="pv-sidebar-footer">
        <button
          id="pvClearRecent"
          class="pv-clear-btn"
          data-i18n="pv_clear_recent"
        >
          Clear Recent
        </button>
        <button id="pvClearFavs" class="pv-clear-btn" data-i18n="pv_clear_favs">
          Clear Favourites
        </button>
      </div>
    </aside>

    <div id="pvSidebarOverlay" class="sidebar-overlay"></div>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <main class="app-wrapper">
      <div class="pv-main">
        <div class="input-group pv-main-search" id="pvMainSearchGroup">
          <input
            type="text"
            id="pvMainSearch"
            class="form-input"
            placeholder="Search player..."
          />
          <button
            class="input-btn"
            id="pvMainSearchBtn"
            aria-label="Search player"
          >
            <i data-lucide="search" width="20" height="20"></i>
          </button>
        </div>

        <!-- Player info card -->
        <div id="pvPlayerCard" class="pv-player-card pv-card">
          <div class="pv-skin-section">
            <canvas id="pvSkinContainer"></canvas>
            <div class="pv-skin-actions">
              <button
                class="pv-skin-btn"
                id="pvDownloadSkinBtn"
                title="Download Skin"
                aria-label="Download skin"
                data-i18n-title="pv_download_skin"
              >
                <i data-lucide="download"></i>
              </button>
              <button
                class="pv-skin-btn"
                id="pvAnimationBtn"
                title="Toggle Animation"
                aria-label="Toggle animation"
                data-i18n-title="pv_toggle_animation"
              >
                <i data-lucide="pause"></i>
              </button>
            </div>
          </div>

          <div class="pv-info">
            <div class="pv-info-field">
              <span class="pv-info-label" data-i18n="pv_name_label"
                >Player Name</span
              >
              <div>
                <span class="pv-info-value" id="pvNameText"
                  >BananaBrother77</span
                >
                <button
                  class="pv-copy-btn"
                  id="pvCopyNameBtn"
                  aria-label="Copy player name"
                >
                  <i data-lucide="copy"></i>
                </button>
              </div>
            </div>

            <div class="pv-info-field">
              <span class="pv-info-label" data-i18n="pv_uuid_label">UUID</span>
              <div>
                <span class="pv-info-value-sm" id="pvUUIDText"
                  >61bd7ef7...</span
                >
                <button
                  class="pv-copy-btn"
                  id="pvCopyUUIDBtn"
                  aria-label="Copy UUID"
                >
                  <i data-lucide="copy"></i>
                </button>
              </div>
            </div>

            <div class="pv-actions">
              <a
                id="pvNameMCLink"
                href="https://namemc.com/"
                target="_blank"
                class="btn-primary"
              >
                <i data-lucide="external-link"></i>
                <span data-i18n="pv_namemc">NameMC</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <%- include('footer.html') %>
    <%- include('settings-modal.html') %>
    <%- include('scripts.html') %>
    <script type="module" src="/assets/js/player-viewer.js"></script>
  </body>
</html>
